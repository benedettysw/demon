<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de producto | MiTienda</title><link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">M</span><span>MiTienda</span></a>
    <form class="search" id="searchForm" role="search"><input id="searchInput" type="search" placeholder="Buscar productos, marcas y más..." aria-label="Buscar productos"><button aria-label="Buscar" type="submit">⌕</button></form>
    <button class="cart-button" id="openCart" aria-label="Abrir carrito">🛒 <span>Carrito</span><b id="cartCount">0</b></button>
  </header>
  <main class="container detail-page">
    <div class="breadcrumbs"><a href="index.html">Inicio</a> / <span id="crumbCategory">Producto</span></div>
    <div id="productDetail"></div>
  </main>
  <footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">M</span><span>MiTienda</span></a><p>Proyecto académico SENA · Tienda demostrativa estática</p><small>Los productos, precios y disponibilidad son ilustrativos.</small></footer>
  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Carrito de compras" aria-hidden="true">
    <div class="drawer-head"><div><span class="eyebrow">TU PEDIDO</span><h2>Mi carrito</h2></div><button id="closeCart" class="icon-button" aria-label="Cerrar carrito">✕</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-summary"><div><span>Subtotal</span><strong id="cartTotal">$0</strong></div><p>El pedido se confirma directamente con el vendedor por WhatsApp.</p><button id="checkoutWhatsApp" class="btn btn-green full">Comprar por WhatsApp ↗</button><button id="clearCart" class="text-button">Vaciar carrito</button></div>
  </aside>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/products.js"></script><script src="js/app.js"></script><script src="js/detail.js"></script>
</body></html>
